<!DOCTYPE html>
<script src="../include.js"></script>
<script>
asyncTest(async done => {
    println(`typeof PublicKeyCredential: ${typeof PublicKeyCredential}`);
    println(`PublicKeyCredential extends Credential: ${PublicKeyCredential.prototype instanceof Credential}`);
    println(`typeof AuthenticatorResponse: ${typeof AuthenticatorResponse}`);
    println(`typeof AuthenticatorAttestationResponse: ${typeof AuthenticatorAttestationResponse}`);
    println(`typeof AuthenticatorAssertionResponse: ${typeof AuthenticatorAssertionResponse}`);
    println(`attestation response extends AuthenticatorResponse: ${AuthenticatorAttestationResponse.prototype instanceof AuthenticatorResponse}`);
    println(`assertion response extends AuthenticatorResponse: ${AuthenticatorAssertionResponse.prototype instanceof AuthenticatorResponse}`);

    println(`conditional mediation available: ${await PublicKeyCredential.isConditionalMediationAvailable()}`);
    println(`platform authenticator available: ${await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()}`);

    const capabilities = await PublicKeyCredential.getClientCapabilities();
    println(`capabilities sorted: ${Object.keys(capabilities).join(",") === Object.keys(capabilities).sort().join(",")}`);
    for (const capability of Object.keys(capabilities))
        println(`${capability}: ${capabilities[capability]}`);

    const signals = [
        ["signalUnknownCredential", {
            rpId: "example.com",
            credentialId: "AQID",
        }],
        ["signalAllAcceptedCredentials", {
            rpId: "example.com",
            userId: "AQID",
            allAcceptedCredentialIds: ["BAUG"],
        }],
        ["signalCurrentUserDetails", {
            rpId: "example.com",
            userId: "AQID",
            name: "user",
            displayName: "User",
        }],
    ];
    for (const [name, options] of signals) {
        try {
            await PublicKeyCredential[name](options);
        } catch (error) {
            println(`${name} rejected with: ${error.name}`);
        }
    }

    const publicKey = {
        challenge: new Uint8Array([1, 2, 3]),
        rp: { name: "Example", id: "example.com" },
        user: {
            id: new Uint8Array([4, 5, 6]),
            name: "user",
            displayName: "User",
        },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }],
        excludeCredentials: [{ type: "public-key", id: new Uint8Array([7, 8, 9]) }],
        extensions: {},
    };

    try {
        await navigator.credentials.create({ publicKey });
    } catch (error) {
        println(`create rejected with: ${error.name}`);
    }

    try {
        await navigator.credentials.get({
            publicKey: {
                challenge: new Uint8Array([1, 2, 3]),
                rpId: "example.com",
                allowCredentials: [{ type: "public-key", id: new Uint8Array([7, 8, 9]) }],
            },
        });
    } catch (error) {
        println(`get rejected with: ${error.name}`);
    }

    for (const [label, operation] of [
        ["create already aborted", () => navigator.credentials.create({ publicKey, signal: AbortSignal.abort("aborted") }).catch(error => {
            println(`create abort reason preserved: ${error === "aborted"}`);
        })],
        ["get already aborted", () => navigator.credentials.get({ publicKey: { challenge: new Uint8Array([1]) }, signal: AbortSignal.abort("aborted") }).catch(error => {
            println(`get abort reason preserved: ${error === "aborted"}`);
        })],
        ["create missing user", () => navigator.credentials.create({ publicKey: { ...publicKey, user: undefined } })],
        ["get missing challenge", () => navigator.credentials.get({ publicKey: {} })],
        ["get invalid descriptor id", () => navigator.credentials.get({
            publicKey: {
                challenge: new Uint8Array([1]),
                allowCredentials: [{ type: "public-key", id: "not a buffer" }],
            },
        })],
    ]) {
        try {
            await operation();
        } catch (error) {
            println(`${label} rejected with: ${error.name}`);
        }
    }

    done();
});
</script>
